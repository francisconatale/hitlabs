<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editorial Works Section</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #d1d5db; /* Gray-300 */
    }
    
    /* Efecto hover personalizado para las filas */
    .work-row:hover .work-title {
      color: #9ca3af; /* gray-400 */
      transform: translateX(10px);
    }
    .work-title {
      transition: all 0.3s ease;
    }
  </style>
</head>
<body class="min-h-screen py-16 flex justify-center items-center">
  <!-- Contenedor principal -->
  <div class="bg-white w-[93%] max-w-[1500px] p-8 md:p-12 lg:p-16 xl:p-20">
    
    <!-- Encabezado de la sección -->
    <div class="flex items-end justify-between border-b border-gray-200 pb-8 mb-12">
      <h2 class="text-4xl md:text-5xl font-bold tracking-tight text-gray-900">Selected Works</h2>
      <span class="text-gray-400 text-sm font-medium uppercase tracking-wider">(2023 — 2024)</span>
    </div>

    <!-- Lista de Trabajos -->
    <div class="flex flex-col">

      <!-- Fila 1 -->
      <a href="#" class="work-row group flex flex-col md:flex-row md:items-center py-8 border-b border-gray-200 cursor-pointer">
        <div class="w-full md:w-[10%] text-gray-400 text-sm font-medium mb-2 md:mb-0">(01)</div>
        <div class="w-full md:w-[60%]">
          <h3 class="work-title text-4xl md:text-5xl lg:text-6xl font-bold tracking-tight text-gray-900 leading-none">Inner Echo</h3>
        </div>
        <div class="w-full md:w-[20%] mt-4 md:mt-0 text-[13px] text-gray-500 uppercase tracking-wider">
          Brand Strategy, Visual System
        </div>
        <div class="w-full md:w-[10%] mt-2 md:mt-0 text-[13px] text-gray-400 text-left md:text-right">
          2024
        </div>
      </a>

      <!-- Fila 2 -->
      <a href="#" class="work-row group flex flex-col md:flex-row md:items-center py-8 border-b border-gray-200 cursor-pointer">
        <div class="w-full md:w-[10%] text-gray-400 text-sm font-medium mb-2 md:mb-0">(02)</div>
        <div class="w-full md:w-[60%]">
          <h3 class="work-title text-4xl md:text-5xl lg:text-6xl font-bold tracking-tight text-gray-900 leading-none">Aura Spaces</h3>
        </div>
        <div class="w-full md:w-[20%] mt-4 md:mt-0 text-[13px] text-gray-500 uppercase tracking-wider">
          Digital Experience, Web
        </div>
        <div class="w-full md:w-[10%] mt-2 md:mt-0 text-[13px] text-gray-400 text-left md:text-right">
          2024
        </div>
      </a>

      <!-- Fila 3 -->
      <a href="#" class="work-row group flex flex-col md:flex-row md:items-center py-8 border-b border-gray-200 cursor-pointer">
        <div class="w-full md:w-[10%] text-gray-400 text-sm font-medium mb-2 md:mb-0">(03)</div>
        <div class="w-full md:w-[60%]">
          <h3 class="work-title text-4xl md:text-5xl lg:text-6xl font-bold tracking-tight text-gray-900 leading-none">Lumina</h3>
        </div>
        <div class="w-full md:w-[20%] mt-4 md:mt-0 text-[13px] text-gray-500 uppercase tracking-wider">
          Art Direction, Print
        </div>
        <div class="w-full md:w-[10%] mt-2 md:mt-0 text-[13px] text-gray-400 text-left md:text-right">
          2023
        </div>
      </a>

      <!-- Fila 4 -->
      <a href="#" class="work-row group flex flex-col md:flex-row md:items-center py-8 border-b border-gray-200 cursor-pointer">
        <div class="w-full md:w-[10%] text-gray-400 text-sm font-medium mb-2 md:mb-0">(04)</div>
        <div class="w-full md:w-[60%]">
          <h3 class="work-title text-4xl md:text-5xl lg:text-6xl font-bold tracking-tight text-gray-900 leading-none">Form & Void</h3>
        </div>
        <div class="w-full md:w-[20%] mt-4 md:mt-0 text-[13px] text-gray-500 uppercase tracking-wider">
          Exhibition Design
        </div>
        <div class="w-full md:w-[10%] mt-2 md:mt-0 text-[13px] text-gray-400 text-left md:text-right">
          2023
        </div>
      </a>

    </div>

    <!-- Botón de ver más -->
    <div class="mt-16 flex justify-center">
      <a href="#" class="text-[14px] font-medium text-gray-900 uppercase tracking-wider border-b border-gray-900 pb-1 hover:text-gray-500 hover:border-gray-500 transition-colors">
        View All Archive
      </a>
    </div>

  </div>
</body>
</html>
